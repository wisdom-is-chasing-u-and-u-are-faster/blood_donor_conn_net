version: '3.8'

services:
  web:
    build: .
    container_name: bdcn-web
    ports:
      - "5000:5000"
    environment:
      - FLASK_SECRET_KEY=super-secret-bdcn-key-12345
      - ENVIRONMENT=development
      - PORT=5000
      - DATABASE_URL=sqlite:///app.db
      - GCP_PROJECT_ID=persistent-genai
    volumes:
      - .:/app
    restart: unless-stopped
