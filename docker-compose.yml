version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bdcn-postgres
    restart: always
    environment:
      POSTGRES_USER: bdcn_user
      POSTGRES_PASSWORD: bdcn_password
      POSTGRES_DB: bdcn_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql

  redis:
    image: redis:7-alpine
    container_name: bdcn-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build: .
    container_name: bdcn-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - FLASK_SECRET_KEY=super-secret-bdcn-key-12345
      - PORT=5000
      - DATABASE_URL=postgresql://bdcn_user:bdcn_password@db:5432/bdcn_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  redis_data:
