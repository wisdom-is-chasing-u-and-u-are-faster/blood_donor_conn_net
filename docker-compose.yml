version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_SECRET_KEY=super-secret-bdcn-key-12345
      - PORT=5000
      - DATABASE_URL=postgresql://bdcn_user:bdcn_password@db:5432/bdcn_db
      - REDIS_URL=redis://cache:6379/0
    depends_on:
      - db
      - cache

  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: bdcn_postgis_db
    environment:
      POSTGRES_USER: bdcn_user
      POSTGRES_PASSWORD: bdcn_password
      POSTGRES_DB: bdcn_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql

  cache:
    image: redis:7-alpine
    container_name: bdcn_redis_cache
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
