version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=sqlite:///db/bdcn.db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    security_opt:
      - no-new-privileges:true
    read_only: true

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
