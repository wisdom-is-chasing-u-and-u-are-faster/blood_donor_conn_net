version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bdcn_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bdcn_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql

  web:
    build: .
    container_name: bdcn_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/bdcn_db
      FLASK_SECRET_KEY: super-secret-bdcn-key-12345
    depends_on:
      - db

volumes:
  pgdata:
