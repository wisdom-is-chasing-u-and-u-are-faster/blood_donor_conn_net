<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - BDCN</title>
    <style>

/*
  Blood Donor Connection Network (BDCN) - Design System
  Variant: variant-A
  Style: Enterprise-grade, clean, professional, trustworthy
*/

/* 1. ROOT & THEME DEFINITIONS =================================== */
:root {
  --font-family-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-family-monospace: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;

  /* Light Theme Palette */
  --primary-color: #0d47a1; /* Deep Blue */
  --primary-color-light: #1976d2;
  --primary-color-dark: #002171;
  --accent-color-green: #2e7d32; /* Green for success/validation */
  --accent-color-red: #d32f2f; /* Red for errors/alerts */
  --accent-color-yellow: #fbc02d; /* Yellow for warnings */
  --gradient-primary: linear-gradient(90deg, var(--primary-color) 0%, var(--primary-color-light) 100%);
  --gradient-text: linear-gradient(90deg, var(--primary-color) 0%, #2e7d32 100%);

  --text-color: #212529;
  --text-color-muted: #6c757d;
  --text-color-inverted: #ffffff;
  --surface-color: #ffffff;
  --background-color: #f8f9fa;
  --border-color: #dee1e6;
  --border-color-interactive: #ced4da;
  --input-bg-color: #ffffff;

  /* Spacing (8pt Grid) */
  --space-1: 0.25rem; /* 4px */
  --space-2: 0.5rem;  /* 8px */
  --space-3: 1rem;    /* 16px */
  --space-4: 1.5rem;  /* 24px */
  --space-5: 2rem;    /* 32px */
  --space-6: 3rem;    /* 48px */

  /* Typography Scale */
  --font-size-display: 3.5rem;
  --font-size-h1: 2.5rem;
  --font-size-h2: 2rem;
  --font-size-h3: 1.5rem;
  --font-size-h4: 1.25rem;
  --font-size-body: 1rem;
  --font-size-small: 0.875rem;
  --font-size-caption: 0.75rem;

  /* Borders & Radii */
  --border-radius-sm: 0.25rem;
  --border-radius-md: 0.5rem;
  --border-radius-lg: 1rem;
  --border-width: 1px;
  --border-width-lg: 2px;

  /* Shadows & Elevation */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
  --shadow-focus-ring: 0 0 0 3px rgba(13, 71, 161, 0.25);

  /* Transitions */
  --transition-fast: all 0.15s ease-in-out;
  --transition-std: all 0.25s ease-in-out;
}

[data-theme="dark"] {
  --primary-color: #42a5f5;
  --primary-color-light: #90caf9;
  --primary-color-dark: #1e88e5;
  --accent-color-green: #66bb6a;
  --accent-color-red: #ef5350;
  --accent-color-yellow: #ffee58;

  --text-color: #e0e0e0;
  --text-color-muted: #9e9e9e;
  --text-color-inverted: #121212;
  --surface-color: #1e1e1e;
  --background-color: #121212;
  --border-color: #424242;
  --border-color-interactive: #616161;
  --input-bg-color: #2c2c2c;
  --shadow-focus-ring: 0 0 0 3px rgba(66, 165, 245, 0.3);
}

/* 2. GLOBAL STYLES ============================================= */
*, *::before, *::after { box-sizing: border-box; }

body {
  font-family: var(--font-family-sans);
  font-size: var(--font-size-body);
  line-height: 1.6;
  color: var(--text-color);
  background-color: var(--background-color);
  margin: 0;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

h1, h2, h3, h4 {
  margin: var(--space-4) 0 var(--space-3) 0;
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -0.02em;
}
h1 { font-size: var(--font-size-h1); }
h2 { font-size: var(--font-size-h2); }
h3 { font-size: var(--font-size-h3); }
h4 { font-size: var(--font-size-h4); }

a {
  color: var(--primary-color);
  text-decoration: none;
  transition: var(--transition-fast);
}
a:hover {
  color: var(--primary-color-dark);
  text-decoration: underline;
}

.container {
  width: 100%;
  max-width: 1440px;
  margin: 0 auto;
  padding: 0 var(--space-4);
}

/* 3. UTILITY CLASSES ============================================ */
.text-gradient {
  background: var(--gradient-text);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-fill-color: transparent;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
.skip-to-content {
    position: absolute;
    top: -100px;
    left: var(--space-3);
    background: var(--primary-color);
    color: var(--text-color-inverted);
    padding: var(--space-2) var(--space-3);
    z-index: 9999;
    transition: top 0.2s ease-in-out;
    border-radius: 0 0 var(--border-radius-md) var(--border-radius-md);
}
.skip-to-content:focus {
    top: 0;
}


/* 4. REUSABLE COMPONENTS ======================================== */

/* --- Header & Navigation --- */
.main-header {
  background-color: var(--surface-color);
  border-bottom: var(--border-width) solid var(--border-color);
  padding: var(--space-2) var(--space-4);
  box-shadow: var(--shadow-sm);
  position: sticky;
  top: 0;
  z-index: 1000;
}
.main-header .container {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--text-color);
}
.logo .icon { color: var(--accent-color-red); }
.main-nav ul {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  gap: var(--space-3);
}
.main-nav a {
  color: var(--text-color-muted);
  font-weight: 600;
  padding: var(--space-2) 0;
  border-bottom: 2px solid transparent;
  text-decoration: none;
}
.main-nav a.active, .main-nav a:hover {
  color: var(--text-color);
  border-bottom-color: var(--primary-color);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.theme-switcher {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 1.25rem;
  color: var(--text-color-muted);
}

/* --- Footer --- */
.main-footer {
  padding: var(--space-5) var(--space-4);
  background-color: var(--surface-color);
  border-top: var(--border-width) solid var(--border-color);
  margin-top: var(--space-6);
  color: var(--text-color-muted);
  font-size: var(--font-size-small);
}
.main-footer .container {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.footer-links { display: flex; gap: var(--space-3); }

/* --- Buttons --- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  font-size: var(--font-size-body);
  font-weight: 600;
  padding: 0.75rem 1.5rem;
  border-radius: var(--border-radius-md);
  border: var(--border-width-lg) solid transparent;
  cursor: pointer;
  transition: var(--transition-std);
  text-decoration: none;
  line-height: 1;
}
.btn:focus-visible { outline: none; box-shadow: var(--shadow-focus-ring); }
.btn-lg { padding: 1rem 2rem; font-size: 1.125rem; }
.btn-sm { padding: 0.5rem 1rem; font-size: var(--font-size-small); }

.btn-primary {
  background: var(--primary-color);
  color: var(--text-color-inverted);
  border-color: var(--primary-color);
}
.btn-primary:hover {
  background: var(--primary-color-dark);
  border-color: var(--primary-color-dark);
}
.btn-primary.gradient {
    background: var(--gradient-primary);
}

.btn-secondary {
  background: var(--surface-color);
  color: var(--primary-color);
  border-color: var(--border-color-interactive);
}
.btn-secondary:hover {
  background-color: var(--background-color);
  border-color: var(--primary-color);
}

.btn-danger {
    background: var(--accent-color-red);
    color: var(--text-color-inverted);
    border-color: var(--accent-color-red);
}
.btn-danger:hover {
    background: #a82424;
    border-color: #a82424;
}

/* --- Cards --- */
.card {
  background: var(--surface-color);
  border: var(--border-width) solid var(--border-color);
  border-radius: var(--border-radius-lg);
  box-shadow: var(--shadow-md);
  padding: var(--space-4);
  transition: var(--transition-std);
}
.card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
}
.card-header {
  padding-bottom: var(--space-3);
  margin-bottom: var(--space-3);
  border-bottom: var(--border-width) solid var(--border-color);
}

/* --- Forms & Inputs --- */
.form-group {
  margin-bottom: var(--space-3);
}
.form-label {
  display: block;
  font-weight: 600;
  margin-bottom: var(--space-2);
}
.form-control {
  display: block;
  width: 100%;
  padding: 0.75rem 1rem;
  font-size: var(--font-size-body);
  background-color: var(--input-bg-color);
  border: var(--border-width) solid var(--border-color-interactive);
  border-radius: var(--border-radius-md);
  transition: var(--transition-fast);
}
.form-control:focus {
  outline: none;
  border-color: var(--primary-color);
  box-shadow: var(--shadow-focus-ring);
}
.form-check {
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

/* --- Badges & Pills --- */
.badge {
  display: inline-block;
  padding: var(--space-1) var(--space-2);
  font-size: var(--font-size-caption);
  font-weight: 700;
  border-radius: var(--border-radius-sm);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.badge-success { background-color: var(--accent-color-green); color: var(--text-color-inverted); }
.badge-warning { background-color: var(--accent-color-yellow); color: #333; }
.badge-danger { background-color: var(--accent-color-red); color: var(--text-color-inverted); }
.badge-primary { background-color: var(--primary-color); color: var(--text-color-inverted); }
.badge-secondary { background-color: var(--border-color); color: var(--text-color-muted); }

/* --- Tables --- */
.table {
    width: 100%;
    border-collapse: collapse;
    background: var(--surface-color);
    border-radius: var(--border-radius-md);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
}
.table th, .table td {
    padding: var(--space-3);
    text-align: left;
    border-bottom: var(--border-width) solid var(--border-color);
}
.table th {
    font-weight: 700;
    background-color: var(--background-color);
}
.table tbody tr:last-child td {
    border-bottom: none;
}
.table tbody tr:hover {
    background-color: var(--background-color);
}

/* 5. SCREEN-SPECIFIC & LAYOUTS ================================== */
.screen {
    display: none; /* Hidden by default */
    padding: var(--space-5) 0;
}
.screen.active {
    display: block; /* Shown by JS */
}

/* Welcome/Login Screen */
.welcome-container {
    min-height: 80vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}
.welcome-container h1 {
    font-size: var(--font-size-display);
    font-weight: 800;
}
.social-login-buttons {
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
    width: 100%;
    max-width: 350px;
    margin-top: var(--space-4);
}

/* Dashboard */
.dashboard-grid {
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: var(--space-4);
}
.map-placeholder {
    height: 600px;
    background: var(--border-color);
    border-radius: var(--border-radius-lg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    color: var(--text-color-muted);
}
.dashboard-sidebar .card {
    margin-bottom: var(--space-4);
}

/* Emergency Alert */
.emergency-alert-banner {
    background-color: var(--accent-color-red);
    color: var(--text-color-inverted);
    padding: var(--space-5);
    border-radius: var(--border-radius-lg);
    text-align: center;
}
.emergency-alert-banner h2 {
    color: var(--text-color-inverted);
    margin-top: 0;
}

/* Achievements */
.achievements-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: var(--space-4);
    margin-top: var(--space-4);
}
.achievement-card {
    text-align: center;
}
.achievement-card .icon {
    font-size: 4rem;
    margin-bottom: var(--space-3);
    color: var(--primary-color);
}


/* 6. RESPONSIVENESS ============================================= */
@media (max-width: 768px) {
    .main-nav { display: none; } /* Simplified for example, real would be a burger */
    .dashboard-grid { grid-template-columns: 1fr; }
    h1 { font-size: 2rem; }
    .welcome-container h1 { font-size: 2.5rem; }
}

@media (max-width: 375px) {
    .container { padding: 0 var(--space-3); }
    h1 { font-size: 1.8rem; }
    .btn-lg { padding: 0.8rem 1.5rem; font-size: 1rem; }
}


</style>
</head>
<body>
    <a href="#main-content" class="skip-to-content">Skip to main content</a>
    <header class="main-header">
        <div class="container">
            <a href="welcome-login.html" class="logo"><span class="icon">🩸</span> BDCN</a>
            <nav class="main-nav">
                 <ul>
                    <li><a href="donor-dashboard.html" class="active">Dashboard</a></li>
                    <li><a href="blood-request-form.html">New Request</a></li>
                    <li><a href="request-status-history.html">History</a></li>
                    <li><a href="achievements-badges.html">Badges</a></li>
                    <li><a href="user-profile.html">Profile</a></li>
                    <li><a href="admin-dashboard.html">Admin</a></li>
                    <li><a href="emergency-alert.html">Emergency</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <button id="theme-switcher" class="theme-switcher" aria-label="Toggle light/dark theme">☀️</button>
                <a href="user-profile.html" class="btn btn-secondary btn-sm">My Profile</a>
            </div>
        </div>
    </header>

    <main id="main-content">
        <section class="screen active">
            <div class="container">
                <h2>Donor Dashboard</h2>
                <div class="dashboard-grid">
                    <div class="map-container card">
                        <div class="map-placeholder">Interactive Map of Donor Density Hotspots</div>
                    </div>
                    <div class="dashboard-sidebar">
                        <div class="card">
                            <div class="card-header">
                                <h4>Filters</h4>
                            </div>
                            <div class="form-group">
                                <label for="proximity-radius" class="form-label">Proximity Radius: <span id="radius-value">25</span> km</label>
                                <input type="range" id="proximity-radius" class="form-control" min="1" max="100" value="25">
                            </div>
                            <div class="form-group">
                                <label for="blood-type-filter" class="form-label">Blood Type</label>
                                <select id="blood-type-filter" class="form-control">
                                    <option>Any</option>
                                    <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
                                    <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="main-footer">
         <div class="container">
            <span>&copy; 2024 Blood Donor Connection Network. All rights reserved.</span>
            <div class="footer-links">
                <a href="#">Privacy Policy</a>
                <a href="#">Terms of Service</a>
            </div>
        </div>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeSwitcher = document.getElementById('theme-switcher');
            const currentTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', currentTheme);
            themeSwitcher.textContent = currentTheme === 'light' ? '🌙' : '☀️';
            themeSwitcher.addEventListener('click', () => {
                let theme = document.documentElement.getAttribute('data-theme');
                let newTheme = theme === 'light' ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                themeSwitcher.textContent = newTheme === 'light' ? '🌙' : '☀️';
            });

            const radiusSlider = document.getElementById('proximity-radius');
            const radiusValue = document.getElementById('radius-value');
            if (radiusSlider) {
                radiusSlider.addEventListener('input', (e) => {
                    radiusValue.textContent = e.target.value;
                });
            }
        });
    </script>
<script src="/js/api.js"></script>
</body>
</html>
