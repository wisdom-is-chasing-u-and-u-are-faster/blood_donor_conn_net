{% extends "quantum_base.html" %}

{% block title %}Sign Up — QuantumLeap Investment Portal{% endblock %}

{% block content %}
<section class="section" style="max-width: 500px; margin: var(--space-4) auto;">
    <div class="card">
        <div class="section-header" style="text-align: center; margin-bottom: var(--space-3);">
            <h2>Create Your Account</h2>
            <p>Join QuantumLeap and start optimizing your portfolio today.</p>
        </div>

        <form id="register-form" method="POST" action="/register">
            <div class="input-group" style="margin-bottom: var(--space-2);">
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" name="full_name" placeholder="Alex Vance" class="input" required style="width: 100%; padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-color);">
            </div>

            <div class="input-group" style="margin-bottom: var(--space-2);">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="alex_investor" class="input" required style="width: 100%; padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-color);">
            </div>

            <div class="input-group" style="margin-bottom: var(--space-2);">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="alex@example.com" class="input" required style="width: 100%; padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-color);">
            </div>

            <div class="input-group" style="margin-bottom: var(--space-3);">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••••••" class="input" required minlength="6" style="width: 100%; padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-color);">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">Complete Registration</button>
        </form>

        <p style="text-align: center; margin-top: var(--space-3); font-size: 14px;">
            Already have an account? <a href="/login" style="color: var(--accent); font-weight: 600;">Sign In here</a>
        </p>
    </div>
</section>
{% endblock %}
