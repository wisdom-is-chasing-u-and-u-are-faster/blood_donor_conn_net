{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <h2>BDCN Login Portal</h2>
    <form method="POST" action="/login/donor">
        <div class="mb-3">
            <label>Username</label>
            <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Log In as Donor</button>
        <a href="/login/admin" class="btn btn-secondary ms-2">Administrator Login</a>
        <a href="/login/hospital" class="btn btn-outline-danger ms-2">Hospital Login</a>
    </form>
</div>
{% endblock %}
