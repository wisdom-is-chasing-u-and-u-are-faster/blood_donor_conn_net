<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Donation | BDCN</title>
    <style>

/*
================================================================================
DESIGN SYSTEM: BDCN - Variant A
================================================================================
*/

/* --------------------
   1. ROOT & THEMES
   -------------------- */
:root {
    /* Color Palette - Light Mode */
    --primary-color: #D92D20; /* Urgent Red */
    --primary-color-dark: #B42318;
    --primary-color-light: #FEECEB;
    --primary-gradient: linear-gradient(90deg, #D92D20 0%, #B42318 100%);
    --accent-color: #175CD3; /* Calming Blue */
    --success-color: #027A48;
    --success-bg: #ECFDF3;
    --warning-color: #F79009;
    --danger-color: #D92D20;
    --danger-bg: #FEF3F2;

    --text-primary: #101828;
    --text-secondary: #475467;
    --text-tertiary: #667085;
    --text-on-primary: #FFFFFF;
    --text-placeholder: #667085;
    
    --bg-canvas: #F9FAFB; /* Off-white for main background */
    --bg-surface: #FFFFFF;
    --bg-surface-raised: #FFFFFF;

    --border-color: #EAECF0;
    --border-color-medium: #D0D5DD;
    --focus-ring-color: #C4E4F3;

    /* Typography */
    --font-family-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
    
    /* Font Sizes */
    --fs-display: 4.5rem;   /* 72px */
    --fs-h1: 3.75rem;      /* 60px */
    --fs-h2: 3rem;         /* 48px */
    --fs-h3: 2.25rem;      /* 36px */
    --fs-h4: 1.875rem;     /* 30px */
    --fs-h5: 1.5rem;       /* 24px */
    --fs-h6: 1.25rem;      /* 20px */
    --fs-body-lg: 1.125rem;/* 18px */
    --fs-body: 1rem;       /* 16px */
    --fs-small: 0.875rem;  /* 14px */
    --fs-caption: 0.75rem; /* 12px */

    /* Font Weights */
    --fw-light: 300;
    --fw-normal: 400;
    --fw-medium: 500;
    --fw-semibold: 600;
    --fw-bold: 700;

    /* Line Heights */
    --lh-tight: 1.25;
    --lh-normal: 1.5;
    --lh-loose: 1.75;
    
    /* Letter Spacing */
    --tracking-tight: -0.02em;
    --tracking-normal: 0;

    /* Spacing (8pt Grid) */
    --space-1: 0.25rem;  /* 4px */
    --space-2: 0.5rem;   /* 8px */
    --space-3: 0.75rem;  /* 12px */
    --space-4: 1rem;     /* 16px */
    --space-5: 1.25rem;  /* 20px */
    --space-6: 1.5rem;   /* 24px */
    --space-8: 2rem;     /* 32px */
    --space-10: 2.5rem;  /* 40px */
    --space-12: 3rem;    /* 48px */
    --space-16: 4rem;    /* 64px */

    /* Borders & Radii */
    --radius-sm: 4px;
    --radius-md: 8px;
    --radius-lg: 16px;
    --radius-full: 9999px;
    --border-width: 1px;
    --border-width-2: 2px;
    
    /* Shadows / Elevation */
    --shadow-sm: 0px 1px 2px rgba(16, 24, 40, 0.05);
    --shadow-md: 0px 4px 8px -2px rgba(16, 24, 40, 0.1), 0px 2px 4px -2px rgba(16, 24, 40, 0.06);
    --shadow-lg: 0px 12px 16px -4px rgba(16, 24, 40, 0.08), 0px 4px 6px -2px rgba(16, 24, 40, 0.03);

    /* Transitions */
    --transition-duration: 200ms;
    --transition-timing: ease-in-out;
    
    /* Layout */
    --container-width: 1280px;
    --header-height: 72px;
}

/* Dark Mode */
[data-theme="dark"] {
    --primary-color: #F05242;
    --primary-color-dark: #D92D20;
    --primary-color-light: #4E1D1D;
    --accent-color: #61A5F5;
    --success-color: #32D583;
    --success-bg: #052F1A;
    --warning-color: #FDB022;
    --danger-color: #F05242;
    --danger-bg: #4E1D1D;

    --text-primary: #F9FAFB;
    --text-secondary: #D0D5DD;
    --text-tertiary: #98A2B3;
    --text-on-primary: #FFFFFF;
    --text-placeholder: #98A2B3;

    --bg-canvas: #101828;
    --bg-surface: #1D2939;
    --bg-surface-raised: #2a3b52;
    
    --border-color: #344054;
    --border-color-medium: #475467;
    --focus-ring-color: #344054;

    --shadow-sm: 0px 1px 2px rgba(0, 0, 0, 0.2);
    --shadow-md: 0px 4px 8px -2px rgba(0, 0, 0, 0.3), 0px 2px 4px -2px rgba(0, 0, 0, 0.2);
    --shadow-lg: 0px 12px 16px -4px rgba(0, 0, 0, 0.3), 0px 4px 6px -2px rgba(0, 0, 0, 0.2);
}

/* --------------------
   2. BASE & RESET
   -------------------- */
*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
    font-size: 100%; /* 16px */
}

body {
    font-family: var(--font-family-sans);
    background-color: var(--bg-canvas);
    color: var(--text-primary);
    line-height: var(--lh-normal);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

h1, h2, h3, h4, h5, h6 {
    font-weight: var(--fw-semibold);
    line-height: var(--lh-tight);
    letter-spacing: var(--tracking-tight);
    color: var(--text-primary);
}

h1 { font-size: var(--fs-h1); }
h2 { font-size: var(--fs-h2); }
h3 { font-size: var(--fs-h3); }
h4 { font-size: var(--fs-h4); }
h5 { font-size: var(--fs-h5); }
h6 { font-size: var(--fs-h6); }

p {
    margin-bottom: var(--space-4);
    max-width: 75ch;
    color: var(--text-secondary);
}

a {
    color: var(--accent-color);
    text-decoration: none;
    transition: color var(--transition-duration) var(--transition-timing);
}

a:hover {
    text-decoration: underline;
}

img, svg {
    max-width: 100%;
    height: auto;
    display: block;
}

/* Accessibility */
.skip-to-content {
    position: absolute;
    left: -10000px;
    top: auto;
    width: 1px;
    height: 1px;
    overflow: hidden;
}

.skip-to-content:focus {
    position: static;
    width: auto;
    height: auto;
    overflow: visible;
    background: var(--bg-surface);
    color: var(--text-primary);
    padding: var(--space-4);
    border: var(--border-width) solid var(--border-color);
    z-index: 10000;
}


/* --------------------
   3. LAYOUT & STRUCTURE
   -------------------- */
.container {
    width: 100%;
    max-width: var(--container-width);
    margin-left: auto;
    margin-right: auto;
    padding-left: var(--space-6);
    padding-right: var(--space-6);
}

.main-header {
    background-color: var(--bg-surface);
    border-bottom: var(--border-width) solid var(--border-color);
    padding: 0 var(--space-6);
    height: var(--header-height);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow-sm);
}

.logo {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    font-size: var(--fs-h6);
    font-weight: var(--fw-bold);
    color: var(--text-primary);
}
.logo-icon {
    width: 32px;
    height: 32px;
    color: var(--primary-color);
}
.logo:hover {
    text-decoration: none;
}

.main-nav ul {
    list-style: none;
    display: flex;
    gap: var(--space-1);
}

.main-nav a {
    display: block;
    padding: var(--space-2) var(--space-3);
    border-radius: var(--radius-md);
    font-weight: var(--fw-semibold);
    color: var(--text-secondary);
    font-size: var(--fs-small);
}
.main-nav a:hover,
.main-nav a.active {
    background-color: var(--bg-canvas);
    color: var(--text-primary);
    text-decoration: none;
}

.main-footer {
    padding: var(--space-8) var(--space-6);
    background-color: var(--bg-surface);
    border-top: var(--border-width) solid var(--border-color);
    margin-top: var(--space-16);
    color: var(--text-tertiary);
    font-size: var(--fs-small);
}

.main-footer .container {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.screen {
    display: none; /* Hidden by default by JS router */
    padding-top: var(--space-8);
    padding-bottom: var(--space-8);
    min-height: calc(100vh - var(--header-height));
}
.screen.active {
    display: block;
}

/* Admin Layout */
.admin-layout {
    display: flex;
    min-height: calc(100vh - var(--header-height));
}

.admin-sidebar {
    width: 280px;
    flex-shrink: 0;
    background: var(--bg-surface);
    border-right: var(--border-width) solid var(--border-color);
    padding: var(--space-6);
}

.admin-nav {
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
}

.admin-nav h3 {
    font-size: var(--fs-caption);
    font-weight: var(--fw-bold);
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: var(--space-4) var(--space-3) var(--space-2);
}

.admin-nav a {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-2) var(--space-3);
    border-radius: var(--radius-md);
    font-weight: var(--fw-semibold);
    color: var(--text-secondary);
    font-size: var(--fs-small);
}
.admin-nav a:hover, .admin-nav a.active {
    background-color: var(--bg-canvas);
    color: var(--text-primary);
    text-decoration: none;
}
.admin-nav a svg {
    width: 20px;
    height: 20px;
}

.admin-main {
    flex-grow: 1;
    padding: var(--space-8) var(--space-10);
    overflow-y: auto;
}

.page-header {
    margin-bottom: var(--space-8);
}

.page-header h1 {
    font-size: var(--fs-h4);
}
.page-header p {
    font-size: var(--fs-body);
    color: var(--text-secondary);
    margin-top: var(--space-2);
}

/* --------------------
   4. COMPONENTS
   -------------------- */

/* --- Buttons --- */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    font-family: var(--font-family-sans);
    font-weight: var(--fw-semibold);
    font-size: var(--fs-body);
    padding: var(--space-3) var(--space-5);
    border-radius: var(--radius-md);
    border: var(--border-width-2) solid transparent;
    cursor: pointer;
    transition: all var(--transition-duration) var(--transition-timing);
    text-decoration: none;
    white-space: nowrap;
}

.btn:focus-visible {
    outline: var(--border-width-2) solid var(--bg-surface);
    box-shadow: 0 0 0 4px var(--focus-ring-color);
}
.btn:disabled, .btn[disabled] {
    opacity: 0.5;
    cursor: not-allowed;
}

/* Primary Button */
.btn-primary {
    background-color: var(--primary-color);
    color: var(--text-on-primary);
    border-color: var(--primary-color);
    box-shadow: var(--shadow-sm);
}
.btn-primary:hover {
    background-color: var(--primary-color-dark);
    border-color: var(--primary-color-dark);
    text-decoration: none;
}

/* Secondary Button */
.btn-secondary {
    background-color: var(--bg-surface);
    color: var(--text-secondary);
    border-color: var(--border-color-medium);
    box-shadow: var(--shadow-sm);
}
.btn-secondary:hover {
    background-color: var(--bg-canvas);
    color: var(--text-primary);
    text-decoration: none;
}

/* Tertiary/Ghost Button */
.btn-tertiary {
    background-color: transparent;
    color: var(--text-secondary);
    border-color: transparent;
}
.btn-tertiary:hover {
    background-color: var(--bg-canvas);
    color: var(--text-primary);
    text-decoration: none;
}

/* Danger Button */
.btn-danger {
    background-color: var(--danger-color);
    color: var(--text-on-primary);
    border-color: var(--danger-color);
    box-shadow: var(--shadow-sm);
}
.btn-danger:hover {
    background-color: #B42318;
    border-color: #B42318;
    text-decoration: none;
}

.btn-lg {
    padding: var(--space-4) var(--space-6);
    font-size: var(--fs-body-lg);
}
.btn-sm {
    padding: var(--space-2) var(--space-4);
    font-size: var(--fs-small);
}
.btn-full {
    width: 100%;
}

/* --- Cards --- */
.card {
    background-color: var(--bg-surface);
    border-radius: var(--radius-lg);
    border: var(--border-width) solid var(--border-color);
    padding: var(--space-6);
    box-shadow: var(--shadow-md);
    transition: all var(--transition-duration) var(--transition-timing);
}

.card:hover {
    box-shadow: var(--shadow-lg);
    transform: translateY(-2px);
}

.card-header {
    padding-bottom: var(--space-4);
    margin-bottom: var(--space-4);
    border-bottom: var(--border-width) solid var(--border-color);
}
.card-header h3, .card-header h4 {
    font-size: var(--fs-h6);
    font-weight: var(--fw-semibold);
}

/* --- Forms & Inputs --- */
.form-group {
    margin-bottom: var(--space-5);
}

.form-label {
    display: block;
    font-size: var(--fs-small);
    font-weight: var(--fw-medium);
    margin-bottom: var(--space-2);
    color: var(--text-primary);
}

.form-input {
    display: block;
    width: 100%;
    padding: var(--space-3) var(--space-4);
    font-size: var(--fs-body);
    background-color: var(--bg-surface);
    border: var(--border-width) solid var(--border-color-medium);
    border-radius: var(--radius-md);
    color: var(--text-primary);
    transition: border-color var(--transition-duration), box-shadow var(--transition-duration);
}

.form-input::placeholder {
    color: var(--text-placeholder);
}

.form-input:focus {
    outline: none;
    border-color: var(--accent-color);
    box-shadow: 0 0 0 4px var(--focus-ring-color);
}

select.form-input {
    appearance: none;
    background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%23667085' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
    background-position: right 0.5rem center;
    background-repeat: no-repeat;
    background-size: 1.5em 1.5em;
    padding-right: 2.5rem;
}

/* --- Tables --- */
.table-wrapper {
    width: 100%;
    overflow-x: auto;
    border: var(--border-width) solid var(--border-color);
    border-radius: var(--radius-lg);
    background: var(--bg-surface);
    box-shadow: var(--shadow-sm);
}

.table {
    width: 100%;
    border-collapse: collapse;
    font-size: var(--fs-small);
}

.table th, .table td {
    padding: var(--space-4);
    text-align: left;
    vertical-align: middle;
}

.table thead {
    background-color: var(--bg-canvas);
}

.table th {
    font-weight: var(--fw-medium);
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-bottom: var(--border-width) solid var(--border-color);
}

.table tbody tr {
    border-bottom: var(--border-width) solid var(--border-color);
}
.table tbody tr:last-child {
    border-bottom: none;
}

.table td {
    color: var(--text-secondary);
}
.table td .font-medium {
    font-weight: var(--fw-medium);
    color: var(--text-primary);
}


/* --- Badges / Pills --- */
.badge {
    display: inline-flex;
    align-items: center;
    padding: var(--space-1) var(--space-3);
    font-size: var(--fs-caption);
    font-weight: var(--fw-medium);
    border-radius: var(--radius-full);
}

.badge-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: var(--space-2);
}

.badge-success {
    background-color: var(--success-bg);
    color: var(--success-color);
}
.badge-success .badge-dot {
    background-color: var(--success-color);
}

.badge-danger {
    background-color: var(--danger-bg);
    color: var(--danger-color);
}
.badge-danger .badge-dot {
    background-color: var(--danger-color);
}

.badge-primary {
    background-color: var(--primary-color-light);
    color: var(--primary-color-dark);
}
.badge-primary .badge-dot {
    background-color: var(--primary-color);
}

/* --- Misc --- */
.text-center { text-align: center; }
.text-gradient {
    background: var(--primary-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-fill-color: transparent;
}
.icon {
    width: 1.25em;
    height: 1.25em;
    display: inline-block;
    vertical-align: middle;
}
.d-flex { display: flex; }
.align-items-center { align-items: center; }
.justify-content-between { justify-content: space-between; }
.gap-2 { gap: var(--space-2); }
.gap-4 { gap: var(--space-4); }
.gap-6 { gap: var(--space-6); }
.gap-8 { gap: var(--space-8); }
.mt-4 { margin-top: var(--space-4); }
.mt-8 { margin-top: var(--space-8); }
.mb-4 { margin-bottom: var(--space-4); }
.mb-8 { margin-bottom: var(--space-8); }

/* --------------------
   5. PAGE-SPECIFIC STYLES
   -------------------- */

/* --- Mobile Donor Flow --- */
.mobile-portal-container {
    max-width: 480px;
    margin: 0 auto;
    padding-top: var(--space-6);
}

.time-slot-list {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: var(--space-4);
    list-style: none;
}
.time-slot-list input[type="radio"] {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
}
.time-slot-list label {
    display: block;
    text-align: center;
    padding: var(--space-4);
    border: var(--border-width-2) solid var(--border-color-medium);
    border-radius: var(--radius-md);
    cursor: pointer;
    font-weight: var(--fw-semibold);
    transition: all var(--transition-duration) var(--transition-timing);
}
.time-slot-list label:hover {
    background: var(--bg-canvas);
    border-color: var(--accent-color);
}
.time-slot-list input[type="radio"]:checked + label {
    background-color: var(--primary-color-light);
    border-color: var(--primary-color);
    color: var(--primary-color-dark);
    box-shadow: 0 0 0 4px var(--focus-ring-color);
}
.time-slot-list input[type="radio"]:focus + label {
    border-color: var(--accent-color);
    box-shadow: 0 0 0 4px var(--focus-ring-color);
}


.map-placeholder {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: var(--bg-canvas) url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><path d="M0 0h100v100H0z" fill="%23e5e7eb"/><path d="M35.6 7.4L2.5 40.5l33.1 33.1 33.1-33.1L35.6 7.4zM35.6 15l25.6 25.5-25.6 25.6L10 40.5 35.6 15zM64.4 92.6L97.5 59.5 64.4 26.4 31.3 59.5l33.1 33.1zM64.4 85L38.8 59.5l25.6-25.6L90 59.5 64.4 85z" fill="%23d1d5db"/></svg>') center/cover;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-color);
    margin-top: var(--space-4);
}

.confirmation-details dt {
    font-weight: var(--fw-semibold);
    color: var(--text-primary);
    margin-top: var(--space-4);
}
.confirmation-details dd {
    color: var(--text-secondary);
    margin-left: 0;
}

/* --- Dashboards --- */
.dashboard-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: var(--space-6);
}

.stat-card h4 {
    font-size: var(--fs-small);
    font-weight: var(--fw-medium);
    color: var(--text-secondary);
}
.stat-card .stat-value {
    font-size: var(--fs-h3);
    font-weight: var(--fw-bold);
    color: var(--text-primary);
    margin-top: var(--space-1);
}
.stat-card .stat-change {
    font-size: var(--fs-small);
    font-weight: var(--fw-medium);
    display: flex;
    align-items: center;
    gap: var(--space-1);
}
.stat-card .stat-change.positive { color: var(--success-color); }
.stat-card .stat-change.negative { color: var(--danger-color); }

.progress-bar {
    width: 100%;
    height: 8px;
    background-color: var(--bg-canvas);
    border-radius: var(--radius-full);
    overflow: hidden;
    margin-top: var(--space-2);
}
.progress-bar-fill {
    height: 100%;
    background-color: var(--primary-color);
    border-radius: var(--radius-full);
}

/* --- Charts --- */
.chart-placeholder {
    width: 100%;
    min-height: 250px;
    background-color: var(--bg-canvas);
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-tertiary);
    border: 1px dashed var(--border-color);
    font-size: var(--fs-small);
}


/* --------------------
   6. RESPONSIVENESS
   -------------------- */
@media (max-width: 768px) {
    :root {
        --fs-display: 3.75rem;
        --fs-h1: 3rem;
        --fs-h2: 2.25rem;
        --fs-h3: 1.875rem;
        --fs-h4: 1.5rem;
        --fs-h5: 1.25rem;
        --fs-h6: 1.125rem;
        --header-height: 64px;
    }
