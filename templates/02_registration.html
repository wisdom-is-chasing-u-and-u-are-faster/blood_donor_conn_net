{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <h2>Donor Account Registration</h2>
    <form method="POST" action="/donor/register">
        <div class="mb-3"><label>Full Name</label><input type="text" name="name" class="form-control" required></div>
        <div class="mb-3"><label>Username</label><input type="text" name="username" class="form-control" required></div>
        <div class="mb-3"><label>Age</label><input type="number" name="age" class="form-control" required></div>
        <div class="mb-3"><label>Gender</label><select name="gender" class="form-control"><option>Male</option><option>Female</option><option>Other</option></select></div>
        <div class="mb-3"><label>Blood Group</label><select name="blood_group" class="form-control"><option>A+</option><option>O-</option><option>B+</option><option>AB-</option></select></div>
        <button type="submit" class="btn btn-success">Register Account</button>
    </form>
</div>
{% endblock %}
